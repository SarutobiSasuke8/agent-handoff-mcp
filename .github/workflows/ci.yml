name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # A hung e2e or parity test must fail fast instead of burning the 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.13 is the documented minimum, 22.x the current LTS line, 24.x the
        # line where node:sqlite is no longer experimental.
        node: ["22.13.1", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - run: node scripts/verify-pack.mjs
      - run: npm run check:registry

  coverage:
    name: src coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  ci-ok:
    # Aggregate gate: the branch ruleset requires this single check.
    name: ci-ok
    needs: [check, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "CI matrix failed: ${{ needs.check.result }}"
            exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "Coverage job failed: ${{ needs.coverage.result }}"
            exit 1
          fi

  # Report floating runtime references (unpinned base images, engines.node
  # ranges, action tags, git deps without a commit SHA). Report mode: warns and
  # writes a step summary, never fails. Flip to failing with `--strict`.
  # See docs/runtime-pins.md.
  pin-check:
    name: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report floating references
        run: node scripts/pin-check.mjs
