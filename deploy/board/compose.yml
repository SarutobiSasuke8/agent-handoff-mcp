services:
  handoff:
    build:
      context: ../..
      dockerfile: deploy/board/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - handoff-data:/var/lib/agent-handoff
      - handoff-policy:/etc/agent-handoff
    networks: [board]
    expose: ["3220"]
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      handoff:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [board]
networks:
  board:
    driver: bridge
volumes:
  handoff-data:
  handoff-policy:
