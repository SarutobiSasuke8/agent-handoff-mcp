events {}
http {
  limit_req_zone $binary_remote_addr zone=handoff_per_ip:10m rate=10r/s;
  upstream handoff { server handoff:3220; }
  server {
    listen 443 ssl;
    server_name handoff.astraeus.ie;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    location = /healthz { limit_req zone=handoff_per_ip burst=5 nodelay; proxy_pass http://handoff; }
    location = /readyz { limit_req zone=handoff_per_ip burst=5 nodelay; proxy_pass http://handoff; }
    location = /mcp {
      limit_req zone=handoff_per_ip burst=20 nodelay;
      proxy_pass http://handoff;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
